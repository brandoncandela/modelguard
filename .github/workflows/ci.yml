name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: modelguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      MODELGUARD_TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/modelguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend-sqlite, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
        env:
          POSTGRES_PASSWORD: ci-only-password
      - name: Start the stack and check the API
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: |
          printf 'MODELGUARD_SECRET_KEY=%s\nMODELGUARD_DEMO_PASSWORD=%s\nPOSTGRES_PASSWORD=ci-only-password\n' \
            "$(python3 -c 'import secrets;print(secrets.token_urlsafe(48))')" "$(python3 -c 'import secrets;print(secrets.token_urlsafe(12))')" > .env
          docker compose up -d
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/v1/health && exit 0; sleep 3; done
          docker compose logs api
          exit 1
